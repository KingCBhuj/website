<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>The Wall — Utopia</title><meta name="description" content="A shared white wall for Utopia. Pin sticky notes, tagged by topic."><style>
*{box-sizing:border-box}[hidden]{display:none!important}html,body{height:100%;margin:0}body{display:flex;flex-direction:column;background:#fff;color:#252920;font:15px/1.4 system-ui,sans-serif}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:8px 12px;border-bottom:1px solid #e5e2d8;background:#fff}.bar a{color:#36552c;text-decoration:none;margin-right:6px}
.bar select,.bar input{font:14px system-ui,sans-serif;padding:7px 10px;border:1px solid #b9beae;border-radius:8px;background:#fff;color:#252920}.bar input[type=text]{width:140px}.bar label{font-size:12px;color:#606458}
#info{margin:0;padding:4px 12px;font-size:12px;color:#606458}#msg{margin:0;padding:0 12px 4px;font-size:13px;color:#606458;min-height:22px}
#scroll{flex:1;overflow:auto;background:#fff}#stage{position:relative}#wall{display:block;background:#fff;touch-action:manipulation;cursor:copy}
.ed{position:absolute;border:0;padding:10px;font:17px/1.3 Georgia,serif;resize:none;box-shadow:0 6px 14px rgba(0,0,0,.18);color:#2b2b24;z-index:2}
a:focus-visible,select:focus-visible,input:focus-visible,textarea:focus-visible,#wall:focus-visible{outline:3px solid #a56b14;outline-offset:2px}
</style></head><body>
<div class="bar" role="toolbar" aria-label="Wall tools"><a href="/utopia/">← Utopia</a><label for="c-note">Note colour</label><select id="c-note"></select><label for="f-topic">Topic</label><select id="f-topic"></select><label for="f-name">Name</label><input type="text" id="f-name" maxlength="40" placeholder="Anonymous" autocomplete="nickname"><label for="f-show">Show</label><select id="f-show"></select></div>
<p id="info">Tap anywhere on the wall to pin a sticky note. Everything is public and cannot be edited by visitors, so please do not share personal details. To request removal, message Chirag Chande.</p><p id="msg" role="status"></p>
<div id="scroll"><div id="stage"><canvas id="wall" width="3200" height="1800" tabindex="0" aria-label="Shared wall. Tap to pin a sticky note, or press Enter to add one."></canvas></div></div>
<script>
(function(){
var BASE='https://uleatcvnmsibdjybrmwo.supabase.co/rest/v1/board_items',KEY='sb_publishable_hJeg6_Rn-PmHSlxDpFnTbg_G7zjbitJ';
var H={apikey:KEY,'Content-Type':'application/json'};
var TOPICS=['Decentralisation and Gram Swaraj','Health habits','Utopia','Community and nature','Simple living','Business and technology','Living well','Something else'];
var COLORS=['#fff3a8','#ffd6e0','#d4ecff','#d9f2c9','#ffe2b8'],CNAMES=['Yellow','Pink','Blue','Green','Orange'];
var W=1600,HT=900,NW=190,NH=160;
function $(i){return document.getElementById(i)}
var cv=$('wall'),ctx=cv.getContext('2d'),stage=$('stage'),sc=$('scroll');
var items=[],seen={},pending=[],lastTs=null,first=true,busy=false,scale=1,ed=null,edWas=false,lastPost=0;
function loadPrefs(){try{var p=JSON.parse(localStorage.getItem('utopia_wall'));if(p&&TOPICS.indexOf(p.topic)>-1)return{topic:p.topic,name:String(p.name||'').slice(0,40),show:TOPICS.indexOf(p.show)>-1?p.show:''}}catch(e){}return{topic:'Something else',name:'',show:''}}
var prefs=loadPrefs();
function savePrefs(){try{localStorage.setItem('utopia_wall',JSON.stringify(prefs))}catch(e){}}
function msg(t){$('msg').textContent=t||''}
function opt(s,v,t){var o=document.createElement('option');o.value=v;o.textContent=t;s.appendChild(o)}
CNAMES.forEach(function(n,i){opt($('c-note'),i,n)});
TOPICS.forEach(function(t){opt($('f-topic'),t,t);opt($('f-show'),t,t)});
var all=document.createElement('option');all.value='';all.textContent='All topics';$('f-show').insertBefore(all,$('f-show').firstChild);
$('f-topic').value=prefs.topic;$('f-name').value=prefs.name;$('f-show').value=prefs.show;
function clamp(v,a,b){return Math.max(a,Math.min(b,v))}
function setT(){ctx.setTransform(cv.width/W,0,0,cv.height/HT,0,0)}
function resize(){scale=Math.max(sc.clientWidth/W,0.6);cv.style.width=(W*scale)+'px';cv.style.height=(HT*scale)+'px';stage.style.width=(W*scale)+'px';stage.style.height=(HT*scale)+'px'}
function pt(e){var r=cv.getBoundingClientRect();return[clamp(Math.round((e.clientX-r.left)*W/r.width),0,W),clamp(Math.round((e.clientY-r.top)*HT/r.height),0,HT)]}
function lbl(it){return (it.name&&String(it.name).trim()?String(it.name).trim():'Anonymous')+' \u00b7 '+it.topic}
function label(it,x,y,mw,col){ctx.font='11px system-ui,sans-serif';ctx.fillStyle=col||'#6b6f62';ctx.textBaseline='alphabetic';ctx.fillText(lbl(it),x,y,mw)}
function wrap(t,mw){var out=[];String(t).split('\n').forEach(function(par){var line='';par.split(/\s+/).forEach(function(w){if(!w)return;while(ctx.measureText(w).width>mw){var i=w.length;while(i>1&&ctx.measureText(w.slice(0,i)).width>mw)i--;if(line){out.push(line);line=''}out.push(w.slice(0,i));w=w.slice(i)}var tr=line?line+' '+w:w;if(line&&ctx.measureText(tr).width>mw){out.push(line);line=w}else line=tr});out.push(line)});return out}
function drawNote(it){var d=it.data||{},x=Number(d.x)||0,y=Number(d.y)||0,r=clamp(Number(d.r)||0,-6,6);ctx.save();ctx.translate(x+NW/2,y+NH/2);ctx.rotate(r*Math.PI/180);ctx.shadowColor='rgba(0,0,0,.2)';ctx.shadowBlur=10;ctx.shadowOffsetY=4;ctx.fillStyle=COLORS[d.k]||COLORS[0];ctx.fillRect(-NW/2,-NH/2,NW,NH);ctx.shadowColor='transparent';ctx.font='17px Georgia,serif';ctx.fillStyle='#2b2b24';ctx.textBaseline='top';var ls=wrap(String(d.t||'').slice(0,120),NW-24);for(var i=0;i<ls.length&&i<6;i++)ctx.fillText(ls[i],-NW/2+12,-NH/2+12+i*20);label(it,-NW/2+12,NH/2-10,NW-24,'#55574d');ctx.restore()}
function penStyle(c,w){ctx.strokeStyle=c;ctx.fillStyle=c;ctx.lineWidth=clamp(Number(w)||3,1,40);ctx.lineCap='round';ctx.lineJoin='round'}
function drawStroke(it){var d=it.data;if(!d||!d.p||!d.p.length)return;penStyle(d.c,d.w);var p=d.p,minX=W,maxY=0,i;if(p.length===1){ctx.beginPath();ctx.arc(Number(p[0][0]),Number(p[0][1]),ctx.lineWidth/2,0,6.2832);ctx.fill()}else{ctx.beginPath();ctx.moveTo(Number(p[0][0]),Number(p[0][1]));for(i=1;i<p.length;i++)ctx.lineTo(Number(p[i][0]),Number(p[i][1]));ctx.stroke()}for(i=0;i<p.length;i++){minX=Math.min(minX,Number(p[i][0])||0);maxY=Math.max(maxY,Number(p[i][1])||0)}label(it,clamp(minX,4,W-120),Math.min(HT-4,maxY+ctx.lineWidth/2+14),160)}
function drawText(it){var d=it.data;if(!d)return;ctx.fillStyle=d.c;ctx.font=Math.min(60,Number(d.s)||22)+'px Georgia,serif';ctx.textBaseline='top';var x=Number(d.x)||0,y=Number(d.y)||0;ctx.fillText(String(d.t||'').slice(0,140),x,y);label(it,x,y+(Math.min(60,Number(d.s)||22))+14,200)}
function redraw(){setT();ctx.fillStyle='#fff';ctx.fillRect(0,0,W,HT);var show=prefs.show,list=items.concat(pending).filter(function(it){return !show||it.topic===show});if(!list.length){ctx.font='22px Georgia,serif';ctx.fillStyle='#b3b6a8';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(show?'Nothing here yet for this topic.':'Tap anywhere to pin the first sticky note.',W/2,HT/2);ctx.textAlign='left'}list.forEach(function(it){if(it.kind==='note')drawNote(it);else if(it.kind==='stroke')drawStroke(it);else if(it.kind==='text')drawText(it)})}
function addRows(rows){var ch=false;rows.forEach(function(r){if(!r||seen[r.id])return;seen[r.id]=1;items.push(r);ch=true;if(!lastTs||r.created_at>lastTs)lastTs=r.created_at});return ch}
function load(){if(busy)return;busy=true;var q=lastTs?'&created_at=gt.'+encodeURIComponent(lastTs)+'&order=created_at.asc&limit=100':'&order=created_at.desc&limit=300';
fetch(BASE+'?select=id,topic,name,kind,data,created_at'+q,{headers:H}).then(function(r){if(!r.ok)throw new Error();return r.json()}).then(function(rows){var fresh=!lastTs;if(fresh)rows.reverse();var ch=addRows(rows);if(ch||first)redraw();first=false;msg('')}).catch(function(){msg('Could not refresh the wall. Retrying...')}).then(function(){busy=false})}
function send(kind,data){var now=Date.now();if(now-lastPost<300)return;lastPost=now;var p={kind:kind,data:data,topic:prefs.topic,name:prefs.name};pending.push(p);redraw();
fetch(BASE,{method:'POST',headers:Object.assign({Prefer:'return=representation'},H),body:JSON.stringify({topic:p.topic,name:p.name||null,kind:kind,data:data})}).then(function(r){if(!r.ok)throw new Error();return r.json()}).then(function(rows){pending=pending.filter(function(x){return x!==p});addRows(rows);redraw();msg('')}).catch(function(){pending=pending.filter(function(x){return x!==p});redraw();msg('Could not save that. Please try again.')})}
function openEditor(px,py){if(ed)return;var x=clamp(px-NW/2,0,W-NW),y=clamp(py-NH/2,0,HT-NH),t=document.createElement('textarea'),done=false;t.className='ed';t.maxLength=120;t.setAttribute('aria-label','Write your sticky note. Click outside or press Ctrl+Enter to pin it. Press Escape to cancel.');t.style.left=(x*scale)+'px';t.style.top=(y*scale)+'px';t.style.width=(NW*scale)+'px';t.style.height=(NH*scale)+'px';t.style.background=COLORS[$('c-note').value]||COLORS[0];t.style.fontSize=Math.max(13,17*scale)+'px';stage.appendChild(t);ed=t;setTimeout(function(){t.focus()},0);
function finish(save){if(done)return;done=true;var v=t.value.trim();t.remove();ed=null;if(save&&v)send('note',{x:Math.round(x),y:Math.round(y),t:v,k:Number($('c-note').value)||0,r:Math.round((Math.random()*6-3)*10)/10})}
t.addEventListener('keydown',function(e){if(e.key==='Escape'){e.preventDefault();finish(false)}else if(e.key==='Enter'&&(e.ctrlKey||e.metaKey)){e.preventDefault();finish(true)}});t.addEventListener('blur',function(){finish(true)})}
cv.addEventListener('pointerdown',function(){edWas=!!ed});
cv.addEventListener('click',function(e){if(edWas){edWas=false;return}var p=pt(e);openEditor(p[0],p[1])});
cv.addEventListener('keydown',function(e){if(e.key==='Enter'){e.preventDefault();openEditor(200+Math.random()*(W-400),150+Math.random()*(HT-300))}});
$('f-topic').addEventListener('change',function(){prefs.topic=this.value;savePrefs()});
$('f-name').addEventListener('input',function(){prefs.name=this.value.trim().slice(0,40);savePrefs()});
$('f-show').addEventListener('change',function(){prefs.show=this.value;savePrefs();redraw()});
window.addEventListener('resize',resize);
resize();redraw();msg('Loading the wall...');load();
setInterval(function(){if(!document.hidden)load()},5000);
})();
</script></body></html>
